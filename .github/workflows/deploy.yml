name: Deploy HTML5 Web

on:
  push:
    branches: [ "main", "master" ]

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unzip and find project
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -iname "TownGeneratorOS-master*.zip" | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            echo "错误：未找到以 TownGeneratorOS-master 开头的 zip 文件"
            exit 1
          fi
          echo "找到压缩包: $ZIP_FILE"
          unzip "$ZIP_FILE" -d ./source
          cd ./source
          PROJECT_DIR=$(find . -name "project.xml" -exec dirname {} \; | head -n 1)
          echo "项目目录: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV
          
          # 关键修改：进入项目目录，强行删除 project.xml 里的版本号限制
          cd "$PROJECT_DIR"
          sed -i 's/ version="[^"]*"//g' project.xml
          echo "已移除版本限制，当前依赖："
          grep haxelib project.xml

      - name: Setup Haxe
        uses: krdlab/setup-haxe@v1
        with:
          haxe-version: 4.2.5

      - name: Install Haxe libs
        run: |
          haxelib install lime 7.8.0
          haxelib install openfl 8.9.7
          haxelib install msignal 1.2.5

      - name: Build Web
        working-directory: ./source/${{ env.PROJECT_DIR }}
        run: haxelib run lime build html5 -Dfinal

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./source/${{ env.PROJECT_DIR }}/Export/html5/bin
