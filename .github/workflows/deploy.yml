name: Build and Deploy HTML5

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip and prepare
        run: |
          if ls *.zip 1> /dev/null 2>&1; then unzip *.zip; fi
          if [ -d "TownGeneratorOS-master" ]; then mv TownGeneratorOS-master/* .; fi

      - name: Setup Haxe
        uses: funkincrew/ci-haxe@v3.1.0
        with:
          haxe-version: '3.4.7'

      - name: Install Dependencies
        run: |
          haxelib install lime 7.3.0
          haxelib install openfl 8.9.0
          haxelib install msignal 1.2.5

      - name: Build HTML5
        run: haxelib run openfl build html5 -release

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'Export/html5/bin'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
