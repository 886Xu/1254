name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Unzip and prepare
      run: |
        if ls *.zip 1> /dev/null 2>&1; then unzip *.zip; fi
        if [ -d "TownGeneratorOS-master" ]; then mv TownGeneratorOS-master/* .; fi

    - name: Setup Haxe
      uses: funkincrew/ci-haxe@v3.1.0
      with:
        haxe-version: '3.4.7'

    - name: Install Dependencies
      run: |
        haxelib install lime 7.3.0
        haxelib install openfl 8.9.0
        haxelib install msignal 1.2.5
        haxelib install hxcpp

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      with:
        packages: 'platform-tools'

    - name: Install Android SDK components
      run: |
        sdkmanager "platforms;android-34" "build-tools;34.0.0" "ndk;25.2.9519653"

    - name: Configure Lime
      run: |
        haxelib run lime config ANDROID_SDK $ANDROID_SDK_ROOT
        haxelib run lime config ANDROID_NDK_ROOT $ANDROID_SDK_ROOT/ndk/25.2.9519653
        haxelib run lime config ANDROID_SETUP true

    - name: Build APK
      run: haxelib run openfl build android -release

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: TownGenerator-CN-APK
        path: Export/android/bin/**/*.apk
