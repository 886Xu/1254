name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Unzip and prepare
      run: |
        if ls *.zip 1> /dev/null 2>&1; then unzip *.zip; fi
        if [ -d "TownGeneratorOS-master" ]; then mv TownGeneratorOS-master/* .; fi

    - name: Setup Haxe
      uses: funkincrew/ci-haxe@v3.1.0
      with:
        haxe-version: '4.3.2'

    - name: Install Dependencies
      run: |
        haxelib install openfl
        haxelib install lime
        haxelib install msignal 1.2.5
        haxelib install hxcpp

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Setup Android NDK
      uses: nttld/setup-ndk@v1
      id: setup-ndk
      with:
        ndk-version: r25b

    - name: Configure Lime
      run: |
        haxelib run lime config ANDROID_SDK $ANDROID_SDK_ROOT
        haxelib run lime config ANDROID_NDK_ROOT ${{ steps.setup-ndk.outputs.ndk-path }}
        haxelib run lime config ANDROID_SETUP true

    - name: Build APK
      run: haxelib run openfl build android -release

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: TownGenerator-CN-APK
        path: Export/android/bin/**/*.apk
